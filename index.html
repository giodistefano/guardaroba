<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0E2A">
<meta name="color-scheme" content="dark">
<meta name="description" content="Registro giornaliero dei capi indossati, con schede prodotto e statistiche.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Guardaroba Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra superiore a due livelli (sezione + sottosezione) con ricerca, data e azione principale; contenuto in colonna larga max 1440px */
:root{
  --bg:#0C1030; --bar:#0A0E2A; --panel:#10163F; --panel2:#141A48; --panel3:#1A2152; --well:#0E1338;
  --line:#262E66; --line2:#39407E; --fg:#E9ECFF; --muted:#AEB5E6; --faint:#4A5290;
  --magenta:#E46BE8; --violet:#6A33E8; --violet2:#9B6BFF;
  --green:#3EE07F; --lime:#A6E44A; --yellow:#F4C542; --amber:#F4A042; --pink:#FF7A9A; --blue:#82B8FF;
  --heat0:#172C4A; --heat1:#1D5A4C; --heat2:#36A577; --heat3:#5EE39A;
  --grad:linear-gradient(90deg,#7B3CFF,#C33AC8 60%,#F0407A);
  --shadow:0 18px 48px rgba(0,4,20,.6);
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.cond{font-family:var(--display)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* barra superiore */
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(180deg,var(--bar),#0C1135);border-bottom:1px solid #232A5E}
.tb-in{max-width:1440px;margin:0 auto;padding-block:10px;padding-inline:24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px}
.logo{width:50px;height:50px;flex:none;border-radius:50%;background:radial-gradient(circle at 30% 30%,#3A4BB8,#151C55);border:2px solid var(--fg);display:flex;align-items:center;justify-content:center;color:#FFF}
.nav{min-width:0}
.nav1{display:flex;flex-wrap:wrap;gap:2px 20px;align-items:baseline}
.nav1 button{border:0;background:transparent;padding:0;cursor:pointer;font-family:var(--display);font-weight:700;font-size:26px;color:var(--fg);display:inline-flex;align-items:center;gap:6px;position:relative}
.nav1 button:hover{color:#FFF}
.nav1 button[aria-current="true"]{color:var(--magenta)}
.nav1 .dotw{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block}
.nav2{display:flex;flex-wrap:wrap;gap:2px 18px;margin-top:2px;min-height:24px}
.nav2 button{border:0;background:transparent;padding:0;cursor:pointer;font-size:15px;color:#C9CEF5}
.nav2 button:hover{color:#FFF}
.nav2 button[aria-current="true"]{color:#FFF;text-decoration:underline;text-underline-offset:6px;text-decoration-color:var(--magenta);text-decoration-thickness:2px}
.tb-right{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:#11163D;color:var(--fg);width:220px}
.search input{border:0;background:transparent;outline:0;width:100%;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search:focus-within{border-color:var(--magenta)}
.dateb{border:1px solid var(--line2);border-radius:10px;padding:4px 12px;line-height:1.1;background:#11163D;font-family:var(--display)}
.dateb .d{font-weight:700;font-size:20px}
.dateb .t{font-weight:600;font-size:17px}
.dateb .t span{color:var(--yellow)}
.cta{height:52px;padding:0 10px 0 20px;border:0;border-radius:10px;background:var(--grad);color:#FFF;font-family:var(--display);font-weight:700;font-size:22px;display:inline-flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 6px 24px rgba(200,60,200,.35);white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 6px;border-radius:8px;background:rgba(255,255,255,.2);font-size:19px}
@media (max-width:1100px){.search{width:170px}}
@media (max-width:820px){
  .tb{position:static}
  .tb-in{padding-inline:16px;gap:8px 16px}
  .logo{width:40px;height:40px}
  .nav{order:3;width:100%}
  .nav1 button{font-size:21px}
  .search,.dateb{display:none}
  .cta{height:44px;font-size:19px}
}

/* struttura */
main{max-width:1440px;margin:0 auto;padding-block:20px 48px;padding-inline:24px;display:flex;flex-direction:column;gap:16px}
@media (max-width:820px){main{padding-inline:16px}}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.eyebrow{font-family:var(--display);font-weight:700;font-size:20px;color:var(--magenta);line-height:1.1}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:34px;line-height:1.08;letter-spacing:.005em;text-wrap:balance}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:21px;color:var(--magenta);line-height:1.15}
.hint{font-size:13.5px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}

/* controlli */
.btn{border:1px solid var(--line2);background:#1A2152;color:var(--fg);border-radius:10px;min-height:42px;padding:0 15px;font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:#222A62}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--violet);border-color:var(--violet2);color:#FFF}
.btn.pri:hover{background:#7740F0}
.btn.grad{background:var(--grad);border:0;color:#FFF;font-weight:600}
.btn.danger{color:var(--pink);border-color:#5A2E5E}
.btn.danger:hover{background:#2A1640}
.btn.icon{width:42px;padding:0}
.btn.sm{min-height:34px;padding:0 10px;font-size:13.5px}
.btn.sm.icon{width:34px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#11163D}
.seg button{min-height:40px;padding:0 15px;border:0;background:transparent;color:#C9CEF5;font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.seg button:hover{color:#FFF;background:#1A2152}
.seg button[aria-pressed="true"]{background:var(--violet);color:#FFF}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #333B7A;background:var(--panel2);border-radius:8px;padding:5px 12px;font-size:15.5px;color:var(--fg);max-width:100%}
.rp{display:inline-block;min-width:44px;text-align:center;padding:2px 8px;border-radius:999px;font-weight:600;font-size:13.5px;color:#0C1030}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.lab{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inp{width:100%;min-height:44px;border:1px solid var(--line2);background:#0E1338;color:var(--fg);border-radius:10px;padding:0 12px;font-size:15px}
textarea.inp{padding:10px 12px;min-height:80px;resize:vertical}
.inp:focus{outline:2px solid var(--magenta);outline-offset:1px}
.inp[aria-invalid="true"]{border-color:var(--pink)}
.err{color:var(--pink);font-size:13.5px;margin-top:6px;min-height:0}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:18px;height:18px;accent-color:var(--violet2)}
.stars{display:inline-flex;gap:1px;vertical-align:middle}

/* tabelle */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-weight:600;color:var(--muted);font-size:13px;text-align:right;padding:8px;white-space:nowrap}
td{font-size:15px;padding:8px;text-align:right;border-top:1px solid #1F2758;vertical-align:middle}
th.l,td.l{text-align:left}
tr.total td{border-top:1px solid var(--line2);font-weight:700}
td .lnk{border:0;background:transparent;padding:0;cursor:pointer;font-weight:500;text-align:left}
td .lnk:hover{text-decoration:underline;text-underline-offset:3px}

/* riquadri */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;display:flex;flex-direction:column}
.tile .big{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1;margin-top:8px;overflow-wrap:anywhere}
.tile .d{font-size:13.5px;color:var(--muted);margin-top:2px}
.tile .ud{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:auto;padding-top:10px}
.tile .ud.has{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.up{color:var(--green)}.down{color:var(--pink)}

/* registro */
.quick{background:linear-gradient(110deg,#1A1B56 0%,#121848 50%,#10163F 100%)}
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.qcat{width:130px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #333B7A;background:var(--panel2);color:var(--fg);font-size:15px;font-weight:500;cursor:pointer}
.chip:hover{border-color:#6A73C8}
.chip[aria-pressed="true"]{background:linear-gradient(90deg,rgba(62,224,127,.24),rgba(62,224,127,.08));border-color:var(--green);color:#FFF}
.reg{overflow-x:auto;padding:0 0 10px}
.rg{display:grid;gap:4px;align-items:center;padding:3px 14px}
.rg-head{padding-top:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.colh{font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.dh{text-align:center;padding:5px 0;border-radius:8px;color:var(--muted)}
.dh .w{font-size:11px;font-weight:600;letter-spacing:.08em}
.dh .n{font-family:var(--display);font-weight:700;font-size:19px;color:var(--fg);line-height:1.1}
.dh.today{background:linear-gradient(180deg,#5B2FD6,#2A2479);box-shadow:inset 0 2px 0 var(--magenta)}
.dh.today .w{color:#FFF}
.dh.we .w{color:var(--faint)}
.subrow{grid-column:1/-1;display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid #2A3270;background:transparent;color:var(--fg);padding:12px 4px 6px;margin-top:6px;cursor:pointer;text-align:left;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase}
.subrow:hover{color:#FFF}
.subrow .chev{transition:transform .15s;color:var(--muted);flex:none}
.subrow[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.subrow .meta{font-family:var(--font);font-weight:500;font-size:13px;letter-spacing:0;color:var(--muted);text-transform:none}
.subrow .sum{margin-left:auto;font-family:var(--font);font-weight:500;font-size:13px;letter-spacing:0;color:var(--muted);text-transform:none}
.pname{display:flex;align-items:center;gap:8px;min-width:0;padding-left:24px}
.pname button{border:0;background:transparent;padding:4px 0;font-size:16px;font-weight:500;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.pname button:hover{text-decoration:underline;text-underline-offset:3px}
.pname .per{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted)}
.trend{display:flex;align-items:flex-end;gap:3px;height:26px}
.trend i{display:block;width:9px;border-radius:2px}
.cell{height:40px;min-width:32px;border:0;border-radius:8px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.cell:hover{background:var(--panel3)}
.cell .o{width:9px;height:9px;border-radius:50%;background:#2E3672;display:flex;align-items:center;justify-content:center;transition:all .12s}
.cell.on .o{width:24px;height:24px;background:var(--green);box-shadow:0 0 0 4px rgba(62,224,127,.18)}
.cell.tcol{background:rgba(91,47,214,.16)}
.cell.tcol:hover{background:rgba(91,47,214,.3)}

/* scheda */
.hero{background:linear-gradient(100deg,#141B4D 0%,#10163F 55%,#0E1338 100%);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hero-crumb{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 20px 0}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.crumb button{border:0;background:transparent;padding:0;color:var(--muted);cursor:pointer}
.crumb button:hover{color:#FFF}
.hero-main{display:flex;flex-wrap:wrap;align-items:stretch;gap:18px 0;padding:14px 20px 4px}
.hero-id{display:flex;gap:18px;align-items:flex-start;padding-right:28px;flex:1 1 460px;min-width:0}
.avatar{width:120px;height:136px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center}
.hero-col{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 28px;border-left:1px solid var(--line)}
.hero-col.h365{align-items:center;text-align:center;gap:6px;padding:0 22px}
.bubble{display:inline-flex;align-items:center;justify-content:center;min-width:86px;padding:2px 16px;border-radius:12px;background:rgba(62,224,127,.16);border:1px solid rgba(62,224,127,.5);color:var(--green);font-family:var(--display);font-size:40px;font-weight:700;line-height:1.15}
.attr-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 18px;align-content:start}
@media (max-width:1000px){.attr-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.attr-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.hero-col{border-left:0;padding:0}.hero-col.h365{padding:0;align-items:flex-start;text-align:left}.hero-id{padding-right:0}.avatar{width:84px;height:96px}}
.rank{background:#2D5BFF;color:#FFF;font-family:var(--display);font-weight:700;font-size:22px;padding:0 8px;border-radius:6px;line-height:1.35}
.hero-foot{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;padding:8px 20px 0}
.tabs{display:flex;gap:26px}
.tabs button{border:0;background:transparent;font-size:18px;color:#C9CEF5;padding:10px 2px 13px;border-bottom:2px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:#FFF;font-weight:600;border-bottom-color:#FFF}
.dd{position:relative}
.dd>summary{list-style:none}
.dd>summary::-webkit-details-marker{display:none}
.dd-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:20;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:250px;display:flex;flex-direction:column}
.dd-pop button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:15px}
.dd-pop button:hover{background:var(--panel3)}
.dd-pop .danger{color:var(--pink)}
.ov{display:flex;flex-wrap:wrap;padding:16px 0}
.ov-cal{flex:1 1 330px;padding:0 18px;border-right:1px solid var(--line);min-width:0}
.ov-attr{flex:3 1 600px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 14px;padding:0 16px;min-width:0;align-content:start}
@media (max-width:760px){.ov-attr{grid-template-columns:minmax(0,1fr)}}
.arow.sbar{flex-wrap:wrap;gap:4px 8px;padding-bottom:7px}
.arow.sbar .albl{flex:none}
.arow .sb{order:4;flex:1 1 100%;height:8px;background:var(--panel3);border-radius:4px;overflow:hidden}
.arow .sb i{display:block;height:100%;border-radius:4px}
.arow .spct{margin-left:auto;font-size:12.5px;color:var(--muted)}
.arow.sbar .aval{min-width:30px}
.ov-info{flex:1 1 240px;padding:0 18px;border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column;gap:12px}
@media (max-width:820px){.ov-cal,.ov-info{border:0}.ov{gap:22px}}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:10px;border:1px solid #2A3270;border-radius:10px;background:var(--well)}
.calgrid .wh{text-align:center;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding-bottom:4px}
.calday{height:40px;border:0;border-radius:8px;background:#161D4C;color:var(--fg);font-family:var(--display);font-weight:600;font-size:17px;cursor:pointer;padding:0}
.calday:hover{background:#222A62}
.calday.on{background:linear-gradient(180deg,#3EE07F,#22B061);color:#0C1030;font-weight:700}
.calday.today{box-shadow:inset 0 0 0 2px var(--magenta)}
.calday:disabled{background:transparent;color:var(--faint);cursor:default}
.calday.blank{visibility:hidden}
.sect{font-weight:600;font-size:16px;padding:0 0 8px;border-bottom:1px solid #2A3270;margin:0 0 6px}
.arow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 10px 4px 12px;border-left:3px solid transparent;margin-bottom:3px;border-radius:2px}
.arow.hl{background:rgba(70,200,120,.15);border-left-color:var(--green)}
.albl{font-size:15.5px;background:#161D4C;border-radius:4px;padding:3px 8px}
.arow.hl .albl{background:transparent;padding-left:0}
.aval{font-family:var(--display);font-weight:700;font-size:20px;min-width:48px;text-align:right}
.pair{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:6px}
.pair:first-of-type{background:var(--panel3)}
.pair button{border:0;background:transparent;padding:0;cursor:pointer;text-align:left;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair button:hover{text-decoration:underline}
.info-v{font-size:16.5px}

/* grafici */
.vchart{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px}
.vaxis{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--display);font-size:13px;color:var(--muted);text-align:right}
.vplot{position:relative;border-bottom:1px solid var(--line2)}
.vplot .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.vbars{position:absolute;inset:0;display:grid;gap:8px;align-items:end;padding:0 4px}
.vbar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.vbar span{font-family:var(--display);font-weight:700;font-size:15px}
.vbar i{display:block;width:100%;max-width:46px;border-radius:5px 5px 0 0}
.vlabels{display:grid;gap:8px;padding:6px 4px 0}
.vlabels span{text-align:center;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 84px;gap:12px;align-items:center;padding:6px 0}
.hbar .trk{height:12px;background:var(--panel3);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;border-radius:4px}
.hbar .val{text-align:right;font-family:var(--display);font-weight:700;font-size:18px}
.hbar .val small{font-family:var(--font);font-weight:500;font-size:12.5px;color:var(--muted);margin-left:4px}
.stacked{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px;margin-bottom:14px}
.stacked div{display:flex;align-items:center;padding-left:12px;font-family:var(--display);font-weight:700;font-size:17px;color:#0C1030;white-space:nowrap;overflow:hidden;min-width:0;letter-spacing:.04em}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px}
.heat span{width:13px;height:13px;border-radius:3px}
.heat-months{display:grid;grid-auto-flow:column;grid-auto-columns:13px;gap:3px;font-size:11px;color:var(--muted);height:16px}
.heat-months span{white-space:nowrap;overflow:visible}
.heat-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.heat-legend i{width:13px;height:13px;border-radius:3px;display:inline-block}
.lane{display:grid;grid-template-columns:40px minmax(0,1fr) 56px;gap:14px;align-items:center;padding:10px 0;border-top:1px solid #1F2758}
.medal{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:21px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.lane-n{border:0;background:transparent;padding:0;cursor:pointer;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;min-width:0}
.lane-n:hover{text-decoration:underline;text-underline-offset:3px}
.lane-trk{height:26px;background:var(--panel2);border-radius:7px;margin-top:6px;overflow:hidden}
.lane-bar{height:100%;border-radius:7px;display:flex;align-items:center;justify-content:flex-end;min-width:34px}
.lane-bar span{font-family:var(--display);font-size:18px;font-weight:700;color:#0C1030;padding-right:10px}
.lane-mv{text-align:center;font-family:var(--display);font-size:18px;font-weight:700}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.podium .pn{border:0;background:transparent;padding:0;cursor:pointer;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block;margin:0 auto}
.podium .blk{border-radius:10px 10px 4px 4px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:44px;font-weight:700;color:rgba(255,255,255,.92)}
.strk{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #1F2758}
.strk .dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.strk .dots i{width:13px;height:6px;border-radius:2px;background:var(--amber)}

/* configuratore */
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:6px;border-radius:10px}
.item:hover{background:var(--panel2)}
.item.sel{background:var(--panel3)}
.item-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:0 10px;min-height:44px;font-size:15.5px;font-weight:500;cursor:pointer}
.item-main .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-main .c{font-family:var(--display);font-weight:700;font-size:16px;color:var(--muted)}
.item-tools{display:flex;gap:2px;padding-right:4px}
.ib{width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{background:var(--panel3);color:#FFF}
.ib.danger:hover{color:var(--pink)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.subpick{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);color:var(--fg);font-size:14px;cursor:pointer;white-space:nowrap}
.subpick:hover,.subpick[aria-expanded="true"]{border-color:var(--violet2);background:var(--panel3)}
.subpick svg{color:var(--muted)}
.subpop{position:absolute;z-index:55;min-width:220px;max-height:320px;overflow-y:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.subpop-h{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}
.subpop button{display:flex;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:15px;min-height:40px}
.subpop button:hover,.subpop button:focus-visible{background:var(--panel3);outline:none}
.subpop button[aria-checked="true"]{color:var(--green);font-weight:600}
.subpop .ck{width:16px;display:inline-flex}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:#FFF}

/* modale e toast */
.overlay{position:fixed;inset:0;background:rgba(4,6,24,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal{background:var(--panel2);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);width:min(480px,100%);padding:22px;max-height:90vh;overflow:auto}
.modal h2{margin-bottom:10px;font-size:24px}
.modal p{margin:0 0 12px;color:var(--muted)}
.modal-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#0C1030;padding:11px 18px;border-radius:10px;font-weight:600;z-index:70;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
footer{max-width:1440px;margin:0 auto;padding-block:0 32px;padding-inline:24px;color:var(--faint);font-size:12.5px}
</style>
</head>

function pad(n){ return (n < 10 ? '0' : '') + n; }
function dkey(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseKey(k){ var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(d, n){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function today(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function daysBetween(a, b){ return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(p){ return (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function fmtDate(k){ var d = parseKey(k); return d.getDate() + ' ' + MSHORT[d.getMonth()].toLowerCase(); }
function fmtDateY(k){ var d = parseKey(k); return d.getDate() + ' ' + MSHORT[d.getMonth()].toLowerCase() + ' ' + d.getFullYear(); }
function fmtEuro(v){ return v == null || isNaN(v) ? '—' : '€ ' + v.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtNum(v, dec){ return Number(v).toLocaleString('it-IT', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); }
function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function avg(a){ return a.length ? a.reduce(function(s, v){ return s + v; }, 0) / a.length : 0; }
function niceMax(v){ if (v <= 4) return 4; var s = [5, 10, 15, 20, 25, 30, 40, 50, 60, 80, 100, 150, 200, 250, 300, 400, 500, 1000]; for (var i = 0; i < s.length; i++) if (v <= s[i]) return s[i]; return Math.ceil(v / 1000) * 1000; }
function rangeLabel(a, b){ if (a === b) return fmtDate(a); var A = parseKey(a), B = parseKey(b); if (A.getMonth() === B.getMonth() && A.getFullYear() === B.getFullYear()) return A.getDate() + '–' + B.getDate() + ' ' + MSHORT[B.getMonth()].toLowerCase(); return fmtDate(a) + ' – ' + fmtDate(b); }
function ago(n){ return n === 0 ? 'oggi' : n === 1 ? 'ieri' : n + ' gg fa'; }
function plural(n, one, many){ return n + ' ' + (n === 1 ? one : many); }

/* ---------- database ---------- */
function initialDb(){
  var C1 = 'cat_capispalla', C2 = 'cat_scarpe';
  function P(id, cat, sub, brand, model){ return { id: id, categoryId: cat, subcategoryId: sub, brand: brand, model: model, cost: null, year: null, color: '', size: '', notes: '', active: true, createdAt: new Date().toISOString() }; }

    app: 'guardaroba-tracker', schemaVersion: 1,
    meta: { createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), lastExportAt: null, sampleUsage: false },

      P('p_mistral', C1, 'sub_piumini', 'Mistral', '100 gr.'), P('p_sman_tmk', C1, 'sub_smanicati', 'TMK Jeans', 'Smanicato'),
      P('p_sman_beige', C1, 'sub_smanicati', '', 'Smanicato beige'), P('p_tommy', C2, 'sub_sneakers', 'Tommy Hilfiger', 'Classic Blue'),
      P('p_tata', C2, 'sub_sneakers', 'TATA', 'Classic Blue'), P('p_marroni', C2, 'sub_ufficio', 'Giancarlo Nori', 'Marroni Office')
    ],
    usage: { p_combipel: ['2026-10-09', '2026-10-10'], p_kway_prim: ['2026-10-11'] }
  };
}
var db, U = {}, lastSaved = null;
function loadDb(){
  var raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) {}
  if (raw){ try { var parsed = JSON.parse(raw); if (validateDb(parsed).ok){ setDb(parsed); return; } } catch (e) {} }
  setDb(initialDb());
}
function setDb(d){ db = d; db.meta = db.meta || {}; U = {}; Object.keys(db.usage || {}).forEach(function(pid){ U[pid] = new Set(db.usage[pid]); }); }
function serialize(){
  var usage = {};
  Object.keys(U).forEach(function(pid){ if (U[pid].size && productById(pid)) usage[pid] = Array.from(U[pid]).sort(); });
  db.usage = usage; return db;
}
function save(){
  db.meta.updatedAt = new Date().toISOString();
  serialize();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); lastSaved = new Date(); } catch (e) { lastSaved = null; }

function validateDb(d){
  if (!d || typeof d !== 'object') return { ok: false, msg: 'Il file non contiene un oggetto JSON.' };
  if (!Array.isArray(d.categories) || !Array.isArray(d.products)) return { ok: false, msg: 'Mancano le liste "categories" o "products": non sembra un export di Guardaroba.' };
  if (d.usage && typeof d.usage !== 'object') return { ok: false, msg: 'Il campo "usage" non è valido.' };
  for (var i = 0; i < d.categories.length; i++){ var c = d.categories[i]; if (!c.id || typeof c.name !== 'string' || !Array.isArray(c.subcategories)) return { ok: false, msg: 'Categoria non valida in posizione ' + (i + 1) + '.' }; }
  for (var j = 0; j < d.products.length; j++){ var p = d.products[j]; if (!p.id || !p.categoryId) return { ok: false, msg: 'Prodotto non valido in posizione ' + (j + 1) + '.' }; }
  d.usage = d.usage || {};
  return { ok: true };
}
function productById(id){ for (var i = 0; i < db.products.length; i++) if (db.products[i].id === id) return db.products[i]; return null; }

function subById(cat, id){ if (!cat) return null; for (var i = 0; i < cat.subcategories.length; i++) if (cat.subcategories[i].id === id) return cat.subcategories[i]; return null; }

function subName(p){ var s = subById(catById(p.categoryId), p.subcategoryId); return s ? s.name : '—'; }
function uses(pid){ return U[pid] || (U[pid] = new Set()); }
function isUsed(pid, k){ return !!(U[pid] && U[pid].has(k)); }

function productsSorted(filterCat){
  var out = [];
  db.categories.forEach(function(c){
    if (filterCat && filterCat !== 'all' && c.id !== filterCat) return;
    c.subcategories.forEach(function(s){ db.products.forEach(function(p){ if (p.categoryId === c.id && p.subcategoryId === s.id) out.push(p); }); });
    db.products.forEach(function(p){ if (p.categoryId === c.id && !subById(c, p.subcategoryId)) out.push(p); });
  });
  return out;
}

/* ---------- calcoli ---------- */
function countIn(pid, s, e){ var n = 0; if (!U[pid]) return 0; U[pid].forEach(function(k){ if (k >= s && k <= e) n++; }); return n; }
function streakInfo(pid, s, e){
  var arr = U[pid] ? Array.from(U[pid]).filter(function(k){ return (!s || k >= s) && (!e || k <= e); }).sort() : [];
  var best = 0, bs = null, be = null, run = 0, rs = null, prev = null, gaps = [];
  arr.forEach(function(k){
    var d = parseKey(k);
    if (prev){ var g = daysBetween(prev, d); if (g === 1) run++; else { run = 1; rs = k; gaps.push(g - 1); } } else { run = 1; rs = k; }
    if (run > best){ best = run; bs = rs; be = k; }
    prev = d;
  });
  var current = 0;
  if (arr.length && daysBetween(parseKey(arr[arr.length - 1]), today()) <= 1){
    current = 1;
    for (var i = arr.length - 2; i >= 0; i--){ if (daysBetween(parseKey(arr[i]), parseKey(arr[i + 1])) === 1) current++; else break; }
  }
  return { best: best, start: bs, end: be, current: current, last: arr.length ? arr[arr.length - 1] : null, first: arr.length ? arr[0] : null, count: arr.length, gapAvg: gaps.length ? avg(gaps) : null, gapMax: gaps.length ? Math.max.apply(null, gaps) : null };
}
function monthly12(pids, endDate){
  var out = [];
  for (var i = 11; i >= 0; i--){
    var d = new Date(endDate.getFullYear(), endDate.getMonth() - i, 1), y = d.getFullYear(), m = d.getMonth(), prefix = y + '-' + pad(m + 1);
    var isCur = (y === endDate.getFullYear() && m === endDate.getMonth());
    var n = 0;
    pids.forEach(function(pid){ if (U[pid]) U[pid].forEach(function(k){ if (k.slice(0, 7) === prefix) n++; }); });
    out.push({ y: y, m: m, n: n, days: isCur ? endDate.getDate() : new Date(y, m + 1, 0).getDate(), cur: isCur });
  }
  return out;
}
function weekly5(pid){ var t = today(), out = []; for (var w = 4; w >= 0; w--){ out.push(countIn(pid, dkey(addDays(t, -(w * 7 + 6))), dkey(addDays(t, -w * 7)))); } return out; }
function seasonOf(m){ return (m === 11 || m <= 1) ? 'Inverno' : m <= 4 ? 'Primavera' : m <= 7 ? 'Estate' : 'Autunno'; }
function seasonStart(d){ var y = d.getFullYear(), m = d.getMonth(); if (m >= 8 && m <= 10) return new Date(y, 8, 1); if (m === 11) return new Date(y, 11, 1); if (m <= 1) return new Date(y - 1, 11, 1); if (m <= 4) return new Date(y, 2, 1); return new Date(y, 5, 1); }
function seasonCounts(pid){ var o = { Autunno: 0, Inverno: 0, Primavera: 0, Estate: 0 }; if (U[pid]) U[pid].forEach(function(k){ o[seasonOf(+k.slice(5, 7) - 1)]++; }); return o; }
/* confronto con la sottocategoria (o con la categoria se il capo è l’unico nella sua sottocategoria) */
function peersOf(p){
  var sub = db.products.filter(function(x){ return x.active !== false && x.categoryId === p.categoryId && x.subcategoryId === p.subcategoryId; });
  if (sub.length < 2) sub = db.products.filter(function(x){ return x.active !== false && x.categoryId === p.categoryId; });
  if (!sub.some(function(x){ return x.id === p.id; })) sub = sub.concat([p]);
  return sub;
}
function relTo(p, f, peers){
  peers = peers || peersOf(p);
  var vals = peers.map(f).filter(function(v){ return v != null; });
  var m = avg(vals), v = f(p);
  if (v == null) return null;
  if (m > 0) return v / m;
  return v > 0 ? 2 : null;
}
function starsFromRatio(r){ return r == null ? 0 : clamp(Math.round(r * 2.5 * 2) / 2, 0, 5); }
function voteFromRatio(r){ return r == null ? null : clamp(4 + 3 * r, 1, 10); }
function voteBg(v){ return v == null ? '#39407E' : v >= 8 ? '#7BD34A' : v >= 6.5 ? '#E9ECFF' : v >= 5.5 ? '#F4C542' : '#FF7A9A'; }
function tier(r, invert){
  if (r == null) return { c: C.fg, hl: false };
  if (invert) r = r > 0 ? 1 / r : 2;
  if (r >= 1.15) return { c: C.green, hl: true };
  if (r >= 0.85) return { c: C.yellow, hl: false };
  return { c: C.fg, hl: false };

    h += '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z" fill="' + fill + '" stroke="#F4C542" stroke-width="1.4"/></svg>';

function trendHtml(arr, h){

    h += '<div class="vbar"><span style="color:' + (i === peak ? C.green : C.fg) + '">' + m.n + '</span><i style="height:' + hh + 'px;background:' + (i === peak ? 'linear-gradient(180deg,#3EE07F,#1F9A55)' : 'linear-gradient(180deg,#7B5CFF,#4A2FB8)') + '"></i></div>';

}
function heatmap(prods, single){

/* ---------- export / import ---------- */
var downloadsCap = null;
try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(function(d){ downloadsCap = d; }).catch(function(){}); } catch (e) {}
function exportJson(){
  var prev = db.meta.lastExportAt;
  db.meta.lastExportAt = new Date().toISOString();
  serialize();
  var json = JSON.stringify(db, null, 2), name = 'guardaroba_' + dkey(new Date()) + '.json';
  function done(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {} render(); toast('Backup esportato: ' + name); }
  function fail(msg){ db.meta.lastExportAt = prev; toast(msg); renderChrome(); }
  if (downloadsCap){
    downloadsCap.save({ filename: name, data: json }).then(done).catch(function(err){ var c = err && err.code; fail(c === 'declined' ? 'Esportazione annullata' : c === 'rate_limited' ? 'C’è già una richiesta di salvataggio aperta' : 'Esportazione non disponibile in questa vista'); });
    return;
  }
  try {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    done();
  } catch (e) { fail('Il browser non ha permesso il download'); }
}
var fileInput = document.getElementById('fileInput');
fileInput.addEventListener('change', function(){
  var file = fileInput.files && fileInput.files[0]; fileInput.value = '';
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try { data = JSON.parse(reader.result); } catch (e) { info('File non leggibile', 'Il file selezionato non è un JSON valido.'); return; }
    var v = validateDb(data);
    if (!v.ok){ info('Import non riuscito', esc(v.msg)); return; }
    var nU = Object.keys(data.usage).reduce(function(a, k){ return a + (data.usage[k] || []).length; }, 0);
    openModal({ title: 'Sostituire i dati attuali?', confirm: 'Importa e sostituisci', danger: true,
      text: 'Il file “' + esc(file.name) + '” contiene ' + data.categories.length + ' categorie, ' + data.products.length + ' capi e ' + nU + ' utilizzi. I dati attuali di questo browser verranno sostituiti: esporta prima un backup se ti servono.',
      onConfirm: function(){ setDb(data); save(); ui.schedaId = null; ui.cfgCat = null; render(); toast('Dati importati'); } });
  };
  reader.readAsText(file);
});

var rT, lastCols = regCols();
window.addEventListener('resize', function(){ clearTimeout(rT); rT = setTimeout(function(){ var c = regCols(); if (c !== lastCols){ lastCols = c; if (ui.view === 'registro') rerenderKeep(); } }, 150); });

/* ---------- avvio ---------- */
loadDb(); loadUi();
try { localStorage.setItem(STORE_KEY, JSON.stringify(serialize())); lastSaved = new Date(); } catch (e) {}
tickClock(); setInterval(tickClock, 30000);
render();
})();
